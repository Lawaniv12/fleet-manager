@if (authPage()) {
  <router-outlet />
} @else {
<div class="flex h-screen bg-gray-50 overflow-hidden">
  <!-- Desktop Sidebar -->
  <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-gray-200">
    <div class="p-6">
      <h2 class="text-2xl font-bold text-blue-600">Keke Ledger</h2>
    </div>
    <nav class="flex-1 px-4 space-y-2 py-4">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path"
           routerLinkActive="bg-blue-50 text-blue-700"
           class="flex items-center px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors font-medium">
          <span>{{ link.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-header />
    <main class="flex-1 overflow-y-auto pb-20 lg:pb-0">
      <router-outlet />
    </main>
  </div>

  <app-bottom-nav />
</div>
}
