@if (authPage()) {
  <router-outlet />
} @else {
<div class="flex min-h-screen bg-gray-50">
  <!-- Desktop Sidebar -->
  <aside class="sticky top-0 hidden h-screen w-64 shrink-0 flex-col border-r border-gray-200 bg-white lg:flex">
    <div class="p-6">
      <h2 class="text-2xl font-bold text-blue-600">Keke Ledger</h2>
    </div>
    <nav class="flex-1 px-4 space-y-2 py-4">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path"
           routerLinkActive="bg-blue-50 text-blue-700"
           class="flex items-center px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors font-medium">
          <span>{{ link.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <app-header />
    <main class="min-w-0 flex-1 overflow-visible pb-24 lg:pb-8">
      <router-outlet />
    </main>
  </div>

  <app-bottom-nav />
</div>
}
